<!doctype html>
<html lang="zh-CN"><meta charset="utf-8">
<style>
*{box-sizing:border-box}body{margin:0;font:12px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#d92327;color:#fff}main{height:225px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:22px;background:radial-gradient(circle at 95% 14%,#bc202536 0 52px,transparent 53px),radial-gradient(circle at 9% 40%,#b91e233b 0 45px,transparent 46px),radial-gradient(circle at 81% 75%,#b01e232b 0 19px,transparent 20px)}button{cursor:pointer;font:inherit}#draw{width:120px;height:120px;border:0;border-radius:50%;display:grid;place-items:center;background:#ffe16b;color:#861c18;margin-bottom:22px;transition:transform .15s,background .15s}#draw:hover{background:#ffe889;transform:scale(1.04)}#draw:active{transform:scale(.96)}#draw:disabled{cursor:wait;opacity:.65}#draw svg{width:44px;height:44px}.controls{display:flex;align-items:center;gap:26px;height:22px;font-weight:600;font-size:14px}.adjust{color:#ffe16b;border:1px solid #ffe16b;border-radius:4px;width:22px;height:18px;background:none;padding:0;font-size:18px;line-height:12px}.adjust:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid white;outline-offset:4px}#status{height:39px;margin:0;padding:5px 12px;font-size:11px;line-height:15px;background:#bd1f24;overflow:auto;color:#fff3c9}#status.error{background:#7a1c1f;color:white}@media(prefers-reduced-motion:reduce){button{transition:none!important}}
</style>
<main><button id="draw" aria-label="开始抽奖" title="开始抽奖"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><rect x="8" y="20" width="32" height="24" rx="3"/><rect x="5" y="14" width="38" height="8" rx="2"/><path d="M21 14v30m7-30v30M24 14C7 15 9 1 17 4c5 2 7 10 7 10Zm0 0C41 15 39 1 31 4c-5 2-7 10-7 10Z"/></svg></button><div class="controls"><button class="adjust" id="minus" aria-label="减少抽奖人数">−</button><span>抽奖人数：<output id="count">2</output></span><button class="adjust" id="plus" aria-label="增加抽奖人数">+</button></div></main>
<p id="status" role="status" aria-live="polite">点击礼物按钮抽奖，中奖人员不再参与后续轮次。</p>
<script>
let count=2,busy=false;
const minus=document.getElementById('minus'),plus=document.getElementById('plus'),draw=document.getElementById('draw'),output=document.getElementById('count'),status=document.getElementById('status');
function render(){output.value=count;minus.disabled=busy||count<=1;plus.disabled=busy;draw.disabled=busy}
minus.onclick=()=>{count=Math.max(1,count-1);render()};plus.onclick=()=>{count++;render()};
draw.onclick=()=>{if(busy)return;busy=true;render();parent.postMessage({pluginMessage:{type:'draw',count}},'*')};
window.onmessage=event=>{const msg=event.data.pluginMessage;if(!msg)return;if(msg.type==='status'){status.textContent=msg.message;status.className=msg.error?'error':''}if(msg.type==='ready'){busy=false;render()}};
render();
</script></html>
