*{box-sizing:border-box}body{margin:0;font:12px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#d92327;color:#fff}button{cursor:pointer;font:inherit}main{width:300px;height:225px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#D82C2C;isolation:isolate}.letters{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;z-index:-1}.letter{position:absolute;fill:#150000;height:120px;width:120px;opacity:.1;transform-origin:50% 50%;transition:all .4s cubic-bezier(0,.6,.5,1);will-change:transform}#language{z-index:2;position:absolute;right:10px;top:10px;height:24px;min-width:30px;border:1px solid #ffdd7877;border-radius:5px;background:#ba202588;color:#FFDD78;padding:2px 7px;font-size:11px;font-weight:600}#draw{position:absolute;top:40px;left:90px;width:120px;height:120px;border:0;border-radius:100%;padding:0;display:flex;align-items:center;justify-content:center;background:#FFDD78;fill:none;stroke:#7E0000;stroke-width:2.5;cursor:pointer;transition:all .5s cubic-bezier(0,.6,.5,1)}#draw:hover{transform:scale(.9)}#draw:active{transform:scale(.5)}#draw[aria-disabled="true"]{cursor:wait}#draw svg{width:50px;height:50px;pointer-events:none}.controls{position:absolute;top:180px;width:180px;height:21px;display:flex;align-items:center;justify-content:center;gap:10px;user-select:none}.controls>span{width:120px;flex-shrink:1;display:flex;align-items:center;justify-content:center;height:21px;font-size:15px;font-weight:600;white-space:nowrap}.adjust{box-sizing:content-box;flex-shrink:1;width:20px;height:14px;border:1px solid #FFDD78;border-radius:4px;display:flex;align-items:center;justify-content:center;background:transparent;color:#FFDD78;padding:0;cursor:pointer}.adjust svg{width:14px;height:14px;pointer-events:none}.adjust:hover{background:#ffdd7866}.adjust:active{opacity:.4}.adjust:disabled{opacity:.4;cursor:default}button:focus-visible{outline:2px solid white;outline-offset:3px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}dialog{position:absolute;inset:0;border:0;margin:auto;width:276px;max-height:211px;border-radius:10px;padding:16px;background:#fffdf8;color:#33251c;box-shadow:0 10px 36px #43110d66}dialog::backdrop{background:#57100d99}dialog h1{font-size:15px;margin:0 0 9px;line-height:1.3}dialog p{font-size:12px;line-height:1.5;margin:0 0 15px;color:#6a5950}.actions{display:flex;justify-content:flex-end;gap:8px}.actions button{border-radius:6px;padding:7px 12px;min-height:32px;border:1px solid #e5dbd4;background:white;color:#5d4537;font-size:12px}.actions .primary{background:#cf2427;border-color:#cf2427;color:white}.actions button:focus-visible{outline:2px solid #cf2427;outline-offset:2px}.actions button:disabled{opacity:.5;cursor:wait}@media(prefers-reduced-motion:reduce){.letter,button{transition:none!important}}
</style>
<main><div class="letters" aria-hidden="true"><svg id="cod-c" class="letter" width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M81.6448 72.4506C78.5674 79.383 71.6084 84.2287 63.504 84.2287C52.5493 84.2287 43.6694 75.3902 43.6694 64.4867C43.6694 53.5832 52.5493 44.7446 63.504 44.7446C71.6084 44.7446 78.5664 49.5893 81.6448 56.5218C81.8015 56.6471 81.9929 56.7271 82.2021 56.7271H123.008C119.131 27.1268 93.4107 4.35931 62.4657 5.01376C31.241 5.67413 4.48108 32.4809 4.00703 63.5628C3.50026 96.839 30.4486 123.972 63.7658 123.972C94.1287 123.972 119.186 101.429 123.008 72.2453H82.2021C81.9929 72.2453 81.8015 72.3243 81.6448 72.4506Z"/></svg><svg id="cod-d" class="letter" width="128" height="128" viewBox="0 0 129 128" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M72.601 83.254C61.6473 83.254 52.7663 74.4155 52.7663 63.512C52.7663 52.6085 61.6473 43.7699 72.601 43.7699C83.5556 43.7699 92.4356 52.6085 92.4356 63.512C92.4356 74.4155 83.5556 83.254 72.601 83.254ZM69.956 5.31836C57.01 5.31836 37.3251 5.29269 28.5621 5.27986V5.27295H0.750977V32.9533H24.0755V121.354C24.0755 121.354 53.8047 121.751 69.956 121.751C102.259 121.751 128.445 95.6866 128.445 63.5347C128.445 31.3828 102.259 5.31836 69.956 5.31836Z"/></svg><svg id="cod-o" class="letter" width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M64 84C52.955 84 44 75.046 44 64C44 52.954 52.955 44 64 44C75.045 44 84 52.954 84 64C84 75.046 75.045 84 64 84ZM64 4C30.863 4 4 30.862 4 64C4 97.137 30.863 124 64 124C97.137 124 124 97.137 124 64C124 30.862 97.137 4 64 4Z"/></svg></div><button id="language" aria-label="Switch to English">EN</button><button id="draw" aria-label="开始抽奖"><svg id="gift" width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="7.5" y="16.5143" width="35" height="8" rx="2.5"/><path d="M32.802 7.00987C29.5621 5.50048 25.2327 7.00987 25.2327 16.0719C36.3514 16.0719 36.042 8.51926 32.802 7.00987Z"/><path d="M17.2133 7.00987C20.4533 5.50048 24.7827 7.00987 24.7827 16.0719C13.664 16.0719 13.9734 8.51926 17.2133 7.00987Z"/><path d="M37.5 24.5143H38.75V25.7643V41.0143C38.75 43.0854 37.0711 44.7643 35 44.7643H15C12.9289 44.7643 11.25 43.0854 11.25 41.0143V25.7643V24.5143H12.5H37.5Z"/><path d="M25 15.7643L25 43.5143"/></svg></button><div class="controls"><button class="adjust" id="minus" aria-label="减少抽奖人数"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width=".7" aria-hidden="true"><path d="M3.5 7h7"/></svg></button><span><span id="count-label">抽奖人数：</span><output id="count">2</output></span><button class="adjust" id="plus" aria-label="增加抽奖人数"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width=".7" aria-hidden="true"><path d="M3.5 7h7M7 3.5v7"/></svg></button></div></main>
<div id="status" class="sr-only" role="status" aria-live="polite"></div>
<dialog id="initialize-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description"><h1 id="dialog-title"></h1><p id="dialog-description"></p><div class="actions"><button id="cancel"></button><button class="primary" id="confirm"></button></div></dialog>
<script>
let count=2,busy=false,language='zh',pending=null,initializing=false;
const $=id=>document.getElementById(id),minus=$('minus'),plus=$('plus'),draw=$('draw'),output=$('count'),status=$('status'),dialog=$('initialize-dialog');
const words={zh:{count:'抽奖人数：',draw:'开始抽奖',minus:'减少抽奖人数',plus:'增加抽奖人数',switch:'Switch to English',title:'需要初始化抽奖页面',description:'当前页面没有可用的人员卡片模板。是否新建抽奖页面？将包含人员卡片和中英双语说明。',cancel:'取消',confirm:'初始化页面',working:'正在初始化…',initialized:'页面已创建。编辑人员卡片后，即可开始抽奖。',picking:'正在抽奖…',result:(r,n)=>'第 '+r+' 轮完成，剩余 '+n+' 人'},en:{count:'Pick count: ',draw:'Start lottery',minus:'Decrease pick count',plus:'Increase pick count',switch:'切换为中文',title:'Initialize a lottery page',description:'This page has no person card template. Create a new lottery page with participant cards and bilingual instructions?',cancel:'Cancel',confirm:'Initialize',working:'Creating…',initialized:'Page created. Edit the participant cards, then start a draw.',picking:'Picking…',result:(r,n)=>'Round '+r+' complete. '+n+' participants remain.'}};
const send=m=>parent.postMessage({pluginMessage:m},'*');
function render(){const w=words[language];document.documentElement.lang=language==='zh'?'zh-CN':'en';output.value=count;minus.disabled=busy||count<=1;plus.disabled=busy||count>=10;draw.disabled=dialog.open;draw.setAttribute('aria-disabled',String(busy||dialog.open));$('language').textContent=language==='zh'?'EN':'中';$('language').title=w.switch;$('language').setAttribute('aria-label',w.switch);$('count-label').textContent=w.count;for(const [id,label]of [['draw',w.draw],['minus',w.minus],['plus',w.plus]]){$(id).setAttribute('aria-label',label);$(id).title=label;}$('dialog-title').textContent=w.title;$('dialog-description').textContent=w.description;$('cancel').textContent=w.cancel;$('confirm').textContent=initializing?w.working:w.confirm;$('confirm').disabled=initializing;$('cancel').disabled=initializing;}
// Original published mouse interaction sequence. The three custom SVGs share a centered origin.
const codC=$('cod-c'),codO=$('cod-o'),codD=$('cod-d');
let isPressed=false;
function setPos(element,x,y){element.style.transform='translate('+x+'px,'+y+'px) rotate('+(Math.random()*360)+'deg)';}
function randomPos(){const w=300,h=225;setPos(codC,(Math.random()*-.5-.1)*w,(Math.random()*-.5+.1)*h);setPos(codO,Math.random()*.5*w,(Math.random()*-.5-.1)*h);setPos(codD,Math.random()*.5*w,(Math.random()*.5+.1)*h);}
function gather(){setPos(codC,0,0);setPos(codO,0,0);setPos(codD,0,0);}
draw.onmouseenter=()=>{gather();isPressed=false;};
draw.onmouseleave=()=>{if(!isPressed)randomPos();};
draw.onmousedown=()=>{gather();isPressed=true;};
draw.onmouseup=()=>{randomPos();};
draw.onpointercancel=()=>{isPressed=false;randomPos();};
minus.onclick=()=>{count=Math.max(1,count-1);render()};plus.onclick=()=>{count=Math.min(10,count+1);render()};
$('language').onclick=()=>{language=language==='zh'?'en':'zh';render();send({type:'set-language',language})};
draw.onclick=event=>{if(event.detail===0)randomPos();if(busy||dialog.open)return;busy=true;status.textContent=words[language].picking;render();send({type:'draw',count,reducedMotion:window.matchMedia('(prefers-reduced-motion: reduce)').matches})};
function cancel(){if(initializing)return;pending=null;dialog.close();status.textContent='';send({type:'cancel-initialization'});render();draw.focus()}
$('cancel').onclick=cancel;dialog.oncancel=event=>{event.preventDefault();cancel()};
$('confirm').onclick=()=>{if(!pending||initializing)return;initializing=true;busy=true;render();send({type:'initialize',token:pending.token})};
window.onmessage=event=>{const msg=event.data.pluginMessage;if(!msg)return;
if(msg.type==='language'){language=msg.language;render()}
if(msg.type==='needs-initialization'){pending=msg;dialog.showModal();render();$('cancel').focus()}
if(msg.type==='initialized'){initializing=false;pending=null;dialog.close();status.textContent=words[language].initialized;render();draw.focus()}
if(msg.type==='result'){status.textContent=words[language].result(msg.round,msg.remaining)}
if(msg.type==='error'){initializing=false;pending=null;if(dialog.open)dialog.close();status.textContent=msg.message;render();draw.focus()}
if(msg.type==='page-changed'&&!initializing){pending=null;if(dialog.open)dialog.close();render()}
if(msg.type==='busy'){busy=true;render()}
if(msg.type==='ready'){busy=false;render()}
};
render();requestAnimationFrame(()=>requestAnimationFrame(randomPos));send({type:'boot'});
</script></html>
