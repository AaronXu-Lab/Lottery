<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:12px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#d92327;color:#fff}button{cursor:pointer;font:inherit}main{height:225px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:22px;background:#d92327}.letters{position:absolute;inset:0;pointer-events:none;overflow:hidden}.letter{position:absolute;font-family:Arial,sans-serif;font-size:160px;font-weight:900;line-height:1;color:#ba2025;opacity:.56;transition:transform 1100ms cubic-bezier(.2,.8,.2,1);will-change:transform}.letter:nth-child(1){left:-45px;top:-20px}.letter:nth-child(2){right:-13px;top:-50px}.letter:nth-child(3){right:-25px;bottom:-76px;font-size:185px}#language{z-index:2;position:absolute;right:10px;top:10px;height:24px;min-width:30px;border:1px solid #ffe16b77;border-radius:5px;background:#ba202588;color:#ffe889;padding:2px 7px;font-size:11px;font-weight:600}#draw{z-index:1;width:120px;height:120px;flex-shrink:0;border:0;border-radius:50%;display:grid;place-items:center;background:#ffe16b;color:#861c18;margin-bottom:22px;transition:transform .16s,background .16s}#draw:hover{background:#ffe889;transform:scale(1.04)}#draw:active{transform:scale(.94)}#draw:disabled{cursor:wait}#draw svg{width:44px;height:44px}.controls{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:26px;height:22px;font-size:14px;font-weight:600}.adjust{display:grid;place-items:center;color:#ffe16b;border:1px solid #ffe16b;border-radius:4px;width:22px;height:18px;background:none;padding:0;font-size:18px;line-height:12px}.adjust:disabled{opacity:.4;cursor:default}button:focus-visible{outline:2px solid white;outline-offset:3px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}dialog{position:absolute;inset:0;border:0;margin:auto;width:276px;max-height:211px;border-radius:10px;padding:16px;background:#fffdf8;color:#33251c;box-shadow:0 10px 36px #43110d66}dialog::backdrop{background:#57100d99}dialog h1{font-size:15px;margin:0 0 9px;line-height:1.3}dialog p{font-size:12px;line-height:1.5;margin:0 0 15px;color:#6a5950}.actions{display:flex;justify-content:flex-end;gap:8px}.actions button{border-radius:6px;padding:7px 12px;min-height:32px;border:1px solid #e5dbd4;background:white;color:#5d4537;font-size:12px}.actions .primary{background:#cf2427;border-color:#cf2427;color:white}.actions button:focus-visible{outline:2px solid #cf2427;outline-offset:2px}.actions button:disabled{opacity:.5;cursor:wait}@media(prefers-reduced-motion:reduce){.letter,button{transition:none!important}}
</style>
<main><div class="letters" aria-hidden="true"><span class="letter">C</span><span class="letter">O</span><span class="letter">D</span></div><button id="language" aria-label="Switch to English">EN</button><button id="draw" aria-label="开始抽奖"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="20" width="32" height="24" rx="3"/><rect x="5" y="14" width="38" height="8" rx="2"/><path d="M21 14v30m7-30v30M24 14C7 15 9 1 17 4c5 2 7 10 7 10Zm0 0C41 15 39 1 31 4c-5 2-7 10-7 10Z"/></svg></button><div class="controls"><button class="adjust" id="minus" aria-label="减少抽奖人数">−</button><span><span id="count-label">抽奖人数：</span><output id="count">2</output></span><button class="adjust" id="plus" aria-label="增加抽奖人数">+</button></div></main>
<div id="status" class="sr-only" role="status" aria-live="polite"></div>
<dialog id="initialize-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description"><h1 id="dialog-title"></h1><p id="dialog-description"></p><div class="actions"><button id="cancel"></button><button class="primary" id="confirm"></button></div></dialog>
<script>
let count=2,busy=false,language='zh',pending=null,initializing=false;
const $=id=>document.getElementById(id),minus=$('minus'),plus=$('plus'),draw=$('draw'),output=$('count'),status=$('status'),dialog=$('initialize-dialog');
const words={zh:{count:'抽奖人数：',draw:'开始抽奖',minus:'减少抽奖人数',plus:'增加抽奖人数',switch:'Switch to English',title:'需要初始化抽奖页面',description:'当前页面没有可用的人员卡片模板。是否新建抽奖页面？将包含人员卡片和中英双语说明。',cancel:'取消',confirm:'初始化页面',working:'正在初始化…',initialized:'页面已创建。编辑人员卡片后，即可开始抽奖。',picking:'正在抽奖…',result:(r,n)=>'第 '+r+' 轮完成，剩余 '+n+' 人'},en:{count:'Pick count: ',draw:'Start lottery',minus:'Decrease pick count',plus:'Increase pick count',switch:'切换为中文',title:'Initialize a lottery page',description:'This page has no person card template. Create a new lottery page with participant cards and bilingual instructions?',cancel:'Cancel',confirm:'Initialize',working:'Creating…',initialized:'Page created. Edit the participant cards, then start a draw.',picking:'Picking…',result:(r,n)=>'Round '+r+' complete. '+n+' participants remain.'}};
const send=m=>parent.postMessage({pluginMessage:m},'*');
function render(){const w=words[language];document.documentElement.lang=language==='zh'?'zh-CN':'en';output.value=count;minus.disabled=busy||count<=1;plus.disabled=busy;draw.disabled=busy||dialog.open;$('language').textContent=language==='zh'?'EN':'中';$('language').title=w.switch;$('language').setAttribute('aria-label',w.switch);$('count-label').textContent=w.count;for(const [id,label]of [['draw',w.draw],['minus',w.minus],['plus',w.plus]]){$(id).setAttribute('aria-label',label);$(id).title=label;}$('dialog-title').textContent=w.title;$('dialog-description').textContent=w.description;$('cancel').textContent=w.cancel;$('confirm').textContent=initializing?w.working:w.confirm;$('confirm').disabled=initializing;$('cancel').disabled=initializing;}
function nudge(){document.querySelectorAll('.letter').forEach((letter,i)=>{const x=(Math.random()-.5)*26,y=(Math.random()-.5)*22,angle=[-18,14,24][i]+(Math.random()-.5)*16;letter.style.transform='translate('+x+'px,'+y+'px) rotate('+angle+'deg)';});}
minus.onclick=()=>{count=Math.max(1,count-1);render()};plus.onclick=()=>{count++;render()};
$('language').onclick=()=>{language=language==='zh'?'en':'zh';render();send({type:'set-language',language})};
draw.onclick=()=>{if(busy||dialog.open)return;nudge();busy=true;status.textContent=words[language].picking;render();send({type:'draw',count,reducedMotion:window.matchMedia('(prefers-reduced-motion: reduce)').matches})};
function cancel(){if(initializing)return;pending=null;dialog.close();status.textContent='';send({type:'cancel-initialization'});render();draw.focus()}
$('cancel').onclick=cancel;dialog.oncancel=event=>{event.preventDefault();cancel()};
$('confirm').onclick=()=>{if(!pending||initializing)return;initializing=true;busy=true;render();send({type:'initialize',token:pending.token})};
window.onmessage=event=>{const msg=event.data.pluginMessage;if(!msg)return;
if(msg.type==='language'){language=msg.language;render()}
if(msg.type==='needs-initialization'){pending=msg;dialog.showModal();render();$('cancel').focus()}
if(msg.type==='initialized'){initializing=false;pending=null;dialog.close();status.textContent=words[language].initialized;render();draw.focus()}
if(msg.type==='result'){status.textContent=words[language].result(msg.round,msg.remaining)}
if(msg.type==='error'){initializing=false;pending=null;if(dialog.open)dialog.close();status.textContent=msg.message;render();draw.focus()}
if(msg.type==='page-changed'&&!initializing){pending=null;if(dialog.open)dialog.close();render()}
if(msg.type==='busy'){busy=true;render()}
if(msg.type==='ready'){busy=false;render()}
};
render();requestAnimationFrame(()=>requestAnimationFrame(nudge));send({type:'boot'});
</script></html>
